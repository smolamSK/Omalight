<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace"><defs></defs><rect width="1280" height="680" fill="#0B0C16"/><text x="50" y="70" font-size="34" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">How Omalight works</text><text x="52" y="104" font-size="17" fill="#DDF7FF" font-weight="normal" opacity="0.7" text-anchor="start" letter-spacing="0">One click on the bottom bar, and the light covers every screen edge.</text><rect x="50" y="150" width="270" height="170" fill="none" stroke="#DDF7FF" stroke-opacity="0.25"/><rect x="50" y="150" width="270" height="4" fill="#82FB9C"/><text x="68" y="194" font-size="28" fill="#82FB9C" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">1</text><text x="102" y="194" font-size="20" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Bottom-bar icon</text><text x="68" y="234" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">Click the lightbulb, or</text><text x="68" y="256" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">press SUPER + ALT + P.</text><polygon points="326,226.0 342,235.0 326,244.0" fill="#DDF7FF" fill-opacity="0.5"/><rect x="360" y="150" width="270" height="170" fill="none" stroke="#DDF7FF" stroke-opacity="0.25"/><rect x="360" y="150" width="270" height="4" fill="#82FB9C"/><text x="378" y="194" font-size="28" fill="#82FB9C" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">2</text><text x="412" y="194" font-size="20" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Control popup</text><text x="378" y="234" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">Opens above the icon.</text><text x="378" y="256" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">Power, brightness,</text><text x="378" y="278" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">width, warmth.</text><polygon points="636,226.0 652,235.0 636,244.0" fill="#DDF7FF" fill-opacity="0.5"/><rect x="670" y="150" width="270" height="170" fill="none" stroke="#DDF7FF" stroke-opacity="0.25"/><rect x="670" y="150" width="270" height="4" fill="#82FB9C"/><text x="688" y="194" font-size="28" fill="#82FB9C" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">3</text><text x="722" y="194" font-size="20" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Service</text><text x="688" y="234" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">Holds the state and</text><text x="688" y="256" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">saves your settings to a</text><text x="688" y="278" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">file.</text><polygon points="946,226.0 962,235.0 946,244.0" fill="#DDF7FF" fill-opacity="0.5"/><rect x="980" y="150" width="270" height="170" fill="none" stroke="#DDF7FF" stroke-opacity="0.25"/><rect x="980" y="150" width="270" height="4" fill="#82FB9C"/><text x="998" y="194" font-size="28" fill="#82FB9C" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">4</text><text x="1032" y="194" font-size="20" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Edge light</text><text x="998" y="234" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">A click-through glow on</text><text x="998" y="256" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.75" text-anchor="start" letter-spacing="0">each screen's edges.</text><text x="50" y="380" font-size="20" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">What it touches on your system</text><rect x="50" y="392" width="8" height="8" fill="#82FB9C"/><text x="72" y="406" font-size="15" fill="#DDF7FF" font-weight="normal" opacity="0.85" text-anchor="start" letter-spacing="0">Brightness: sets the screen to 100% when the light turns on (omarchy brightness).</text><rect x="50" y="432" width="8" height="8" fill="#82FB9C"/><text x="72" y="446" font-size="15" fill="#DDF7FF" font-weight="normal" opacity="0.85" text-anchor="start" letter-spacing="0">Theme: reads your Omarchy colours so the popup matches the theme you use.</text><rect x="50" y="472" width="8" height="8" fill="#82FB9C"/><text x="72" y="486" font-size="15" fill="#DDF7FF" font-weight="normal" opacity="0.85" text-anchor="start" letter-spacing="0">Settings: saved to ~/.config/omarchy/edge-light/settings.json, nothing else.</text><rect x="50" y="512" width="8" height="8" fill="#82FB9C"/><text x="72" y="526" font-size="15" fill="#DDF7FF" font-weight="normal" opacity="0.85" text-anchor="start" letter-spacing="0">Network: none. No camera, no microphone, no video is read.</text><rect x="50" y="590" width="1180" height="1" fill="#DDF7FF" fill-opacity="0.15"/><text x="50" y="618" font-size="13" fill="#DDF7FF" font-weight="normal" opacity="0.6" text-anchor="start" letter-spacing="1.2">SHORTCUTS</text><text x="220" y="618" font-size="16" fill="#82FB9C" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">SUPER + ALT + E</text><text x="420" y="618" font-size="15" fill="#DDF7FF" font-weight="normal" opacity="0.8" text-anchor="start" letter-spacing="0">turn the light on or off</text><text x="760" y="618" font-size="16" fill="#82FB9C" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">SUPER + ALT + P</text><text x="960" y="618" font-size="15" fill="#DDF7FF" font-weight="normal" opacity="0.8" text-anchor="start" letter-spacing="0">open the popup</text></svg>