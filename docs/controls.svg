acing="0">2</text><rect x="564" y="249.10000000000002" width="26" height="26" fill="#82FB9C"/><text x="577" y="267.1" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">3</text><rect x="564" y="321.6" width="26" height="26" fill="#82FB9C"/><text x="577" y="339.6" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">4</text><rect x="564" y="394.09999999999997" width="26" height="26" fill="#82FB9C"/><text x="577" y="412.09999999999997" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">5</text><rect x="564" y="498.5" width="26" height="26" fill="#82FB9C"/><text x="577" y="516.5" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">6</text><text x="40" y="80" font-size="24" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">What each control does</text><rect x="40" y="126" width="26" height="26" fill="#82FB9C"/><text x="53" y="145" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">1</text><text x="84" y="146" font-size="18" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Power switch</text><text x="84" y="168" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.7" text-anchor="start" letter-spacing="0">Turns the light on or off.</text><rect x="40" y="206" width="26" height="26" fill="#82FB9C"/><text x="53" y="225" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">2</text><text x="84" y="226" font-size="18" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Status line</text><text x="84" y="248" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.7" text-anchor="start" letter-spacing="0">On or Off, with brightness and warmth.</text><rect x="40" y="286" width="26" height="26" fill="#82FB9C"/><text x="53" y="305" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">3</text><text x="84" y="306" font-size="18" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Brightness</text><text x="84" y="328" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.7" text-anchor="start" letter-spacing="0">How strong the light is, 0 to 100%.</text><rect x="40" y="366" width="26" height="26" fill="#82FB9C"/><text x="53" y="385" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">4</text><text x="84" y="386" font-size="18" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Width</text><text x="84" y="408" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.7" text-anchor="start" letter-spacing="0">How thick the edge band is, 4 to 120 px.</text><rect x="40" y="446" width="26" height="26" fill="#82FB9C"/><text x="53" y="465" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">5</text><text x="84" y="466" font-size="18" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Warmth</text><text x="84" y="488" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.7" text-anchor="start" letter-spacing="0">Warm 2700 K to cool 6500 K.</text><rect x="40" y="526" width="26" height="26" fill="#82FB9C"/><text x="53" y="545" font-size="15" fill="#0B0C16" font-weight="bold" opacity="1.0" text-anchor="middle" letter-spacing="0">6</text><text x="84" y="546" font-size="18" fill="#DDF7FF" font-weight="bold" opacity="1.0" text-anchor="start" letter-spacing="0">Hint</text><text x="84" y="568" font-size="14" fill="#DDF7FF" font-weight="normal" opacity="0.7" text-anchor="start" letter-spacing="0">What you can do next.</text></svg>